name: ETF-Bot aktualisieren

# Läuft automatisch alle 15 Minuten, Montag bis Freitag zwischen 6 und 21 Uhr (UTC).
# GitHub startet geplante Läufe nicht sekundengenau, 5 bis 15 Minuten Verzug sind normal.
on:
  schedule:
    - cron: "*/15 6-21 * * 1-5"
  workflow_dispatch:        # Knopf "Run workflow" in GitHub unter "Actions"
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "config.json"
      - "docs/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: etf-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bisherigen Datenstand holen (damit das Signal-Protokoll erhalten bleibt)
        run: |
          mkdir -p site
          cp -r docs/. site/
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git show FETCH_HEAD:data.json > site/data.json.prev 2>/dev/null && mv site/data.json.prev site/data.json || rm -f site/data.json.prev
            git show FETCH_HEAD:signal_log.json > site/signal_log.json.prev 2>/dev/null && mv site/signal_log.json.prev site/signal_log.json || rm -f site/signal_log.json.prev
            git show FETCH_HEAD:charts.json > site/charts.json.prev 2>/dev/null && mv site/charts.json.prev site/charts.json || rm -f site/charts.json.prev
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bot ausführen
        run: python collector.py --out site

      - name: Seite veröffentlichen
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
