name: Nachrichten aktualisieren

# Holt alle 10 Minuten neue Schlagzeilen, auch nachts und am Wochenende.
# Die Kurse bleiben unberührt, die holt update.yml.
# GitHub startet geplante Läufe nicht sekundengenau, einige Minuten Verzug sind normal.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:        # Knopf "Run workflow" in GitHub unter "Actions"

permissions:
  contents: write

# gleiche Gruppe wie update.yml, damit sich beide beim Veröffentlichen nicht in die Quere kommen
concurrency:
  group: etf-bot
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bisherigen Datenstand holen
        run: |
          mkdir -p site
          cp -r docs/. site/
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            for f in data.json signal_log.json charts.json news.json; do
              git show FETCH_HEAD:$f > site/$f.prev 2>/dev/null && mv site/$f.prev site/$f || rm -f site/$f.prev
            done
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nachrichten holen
        run: python collector.py --news-only --out site

      - name: Seite veröffentlichen
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Nachrichten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
